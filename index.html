<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trashback - Login Screen</title>
  <link rel="stylesheet" href="assets/css/daftar-masuk.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800" rel="stylesheet" />
</head>

<body class="page-masuk">

  <!-- Hiasan gelembung hijau -->
  <div class="blob blob-tr-1"></div>
  <div class="blob blob-bl-1"></div>
  <div class="blob blob-bl-2"></div>

  <div class="card">
    <h1 class="title">Masuk</h1>
    <p class="subtitle">Pastikan kamu sudah pernah<br />membuat akun Trashback</p>

    <form id="masukForm" novalidate>
      <div class="input-group">
        <span class="input-label">Email:</span>
        <input type="email" id="email" name="email" placeholder="contoh@gmail.com" autocomplete="email" required />
      </div>

      <div class="input-group">
        <span class="input-label">Password:</span>
        <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password"
          required />
      </div>

      <p class="error-msg" id="errorMsg"></p>

      <button type="submit" class="btn-primary">Masuk</button>
    </form>

    <p class="switch-auth">
      Tidak punya akun?&nbsp;
      <a href="pages/daftar.html" class="link-accent">Yuk daftar!</a>
    </p>
  </div>

  <script src="assets/js/script.js"></script>
</body>

</html>
