<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/style.css">

    <div class="app-container">

                        </div>
                        <div class="machine-details">
                            <p class="distance-text text-body-large font-bold">10 m dari kamu</p>

                        </div>
                    </div>
                </article>

                <article class="machine-card">

                            <button class="go-button text-caption font-semibold">Pergi</button>
                        </div>
                    </div>
                </article>

                <article class="machine-card">
                    <div class="machine-card-content">
                        <div class="machine-image-wrapper">
                            <img src="../assets/img/mesin-sampah.jpeg" alt="Mesin Trashback" class="machine-img">
                        </div>
                        <div class="machine-details">
                            <p class="distance-text text-body-large font-bold">78 m dari kamu</p>
